<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }
    .header { margin-bottom: 4px; }
    .header h1 { font-size: 16px; font-weight: 700; display: inline; }
    .badge-pro {
      font-size: 10px;
      background: linear-gradient(135deg, #059669, #34d399);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px;
      display: none;
    }
    .usage-info {
      font-size: 11px;
      color: #888;
      margin-bottom: 14px;
    }
    .section {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 10px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #059669;
    }
    .checkbox-row label {
      font-size: 13px;
      flex: 1;
      cursor: pointer;
    }
    .format-toggle {
      display: flex;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }
    .format-btn {
      flex: 1;
      padding: 8px;
      background: white;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      transition: all 0.15s;
    }
    .format-btn.active {
      background: #059669;
      color: white;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .option-row label {
      font-size: 13px;
      flex: 1;
      cursor: pointer;
    }
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ccc;
      border-radius: 10px;
      transition: 0.2s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: #059669; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); }
    #scrapeBtn {
      width: 100%;
      padding: 12px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }
    #scrapeBtn:hover { background: #047857; }
    #scrapeBtn:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      min-height: 18px;
      text-align: center;
    }
    #status.error { color: #e53935; }
    #status.success { color: #2e7d32; }
    .lead-count {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      display: none;
    }
    .paywall-notice {
      background: linear-gradient(135deg, #ecfdf5, #d1fae5);
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }
    .paywall-notice .paywall-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .paywall-notice .paywall-desc {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
    }
    .paywall-notice .upgrade-btn {
      display: inline-block;
      background: #059669;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
    }
    .paywall-notice .upgrade-btn:hover { background: #047857; }
    .pro-only-badge {
      font-size: 9px;
      background: linear-gradient(135deg, #059669, #34d399);
      color: white;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      margin-left: 4px;
    }
    .activate-section {
      margin-top: 10px;
      text-align: center;
    }
    .activate-toggle {
      font-size: 11px;
      color: #059669;
      cursor: pointer;
      background: none;
      border: none;
      font-weight: 600;
    }
    .activate-toggle:hover { text-decoration: underline; }
    .key-input-row {
      display: none;
      margin-top: 8px;
      gap: 6px;
    }
    .key-input-row.visible { display: flex; }
    .key-input-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .key-input-row input:focus { border-color: #059669; }
    .key-input-row button {
      padding: 8px 14px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .key-input-row button:hover { background: #047857; }
    #keyStatus {
      font-size: 11px;
      margin-top: 4px;
      min-height: 14px;
    }
    #keyStatus.error { color: #e53935; }
    #keyStatus.success { color: #2e7d32; }
  </style>
</head>
<body>
  <div class="header">
    <h1>MapLeads</h1>
    <span class="badge-pro" id="proBadge">PRO</span>
  </div>
  <div class="usage-info" id="usageInfo"></div>

  <div class="section">
    <div class="section-title">Options</div>
    <div class="option-row">
      <label for="autoScroll">Auto-scroll to load all results</label>
      <div class="toggle-switch">
        <input type="checkbox" id="autoScroll" checked>
        <span class="toggle-slider"></span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Fields to export</div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-name" checked>
      <label for="cb-name">Business name</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-category" checked>
      <label for="cb-category">Category</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-address" checked>
      <label for="cb-address">Address</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-phone" checked>
      <label for="cb-phone">Phone</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-website" checked>
      <label for="cb-website">Website</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-rating" checked>
      <label for="cb-rating">Rating &amp; reviews</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-hours">
      <label for="cb-hours">Business hours <span class="pro-only-badge" id="hoursProBadge">PRO</span></label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cb-mapsurl" checked>
      <label for="cb-mapsurl">Google Maps URL</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Download as</div>
    <div class="format-toggle">
      <button class="format-btn active" data-format="csv">CSV</button>
      <button class="format-btn" data-format="json">JSON</button>
    </div>
  </div>

  <div id="leadCount" class="lead-count"></div>

  <button id="scrapeBtn">Extract Leads</button>
  <div id="status"></div>

  <div class="paywall-notice" id="paywall-notice">
    <div class="paywall-title">$139 · Lifetime License</div>
    <div class="paywall-desc">Unlimited usage, lifetime.</div>
    <button class="upgrade-btn" id="upgradeBtn">Buy PRO - $139</button>
  </div>

  <div class="activate-section" id="activateSection">
    <button class="activate-toggle" id="activateToggle">Already purchased? Activate PRO</button>
    <div class="key-input-row" id="keyInputRow">
      <input type="text" id="licenseKeyInput" placeholder="Paste activation code">
      <button id="activateBtn">Activate</button>
    </div>
    <div id="keyStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
